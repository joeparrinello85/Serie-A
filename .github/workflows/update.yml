name: Update Serie A Intelligence Hub

on:
  push:
    branches:
      - main
  schedule:
    # 1. Matchday Windows (Fri, Sat, Sun, Mon): Every 15 minutes between 10:00 and 23:59 UTC (4 AM - 6 PM MDT)
    - cron: '*/15 10-23 * * 0,1,5,6'

    # 2. Matchday Off-Hours (Fri, Sat, Sun, Mon): Every 2 hours overnight
    - cron: '0 0,2,4,6,8 * * 0,1,5,6'

    # 3. Mid-Week Maintenance (Tue, Wed, Thu): Every 6 hours
    - cron: '0 0,6,12,18 * * 2,3,4'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install certifi beautifulsoup4 requests

      - name: Fetch & Build Dashboard
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python3 fetch_serie_a.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4