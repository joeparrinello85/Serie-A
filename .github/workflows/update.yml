name: Update Serie A Intelligence Hub

name: Commit Updated Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update Serie A data [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
on:
  schedule:
    # 1. Matchday Windows: Every 15 mins between 12:00 and 22:00 UTC on Fri, Sat, Sun, Mon
    - cron: '*/15 12-22 * * 5,6,0,1'
    
    # 2. Matchday Off-Hours: Every 2 hours outside active windows on match days
    - cron: '0 0-11,23 * * 5,6,0,1'
    
    # 3. Mid-Week Maintenance: Every 6 hours on Tue, Wed, Thu
    - cron: '0 */6 * * 2,3,4'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install certifi beautifulsoup4 requests

      - name: Fetch & Build Dashboard
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python3 fetch_serie_a.py

      - name: Commit Updated Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update Serie A data [skip ci]" || exit 0
          git push origin main

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4