name: Update Serie A Intelligence Hub

on:
  schedule:
    # Runs every 15 mins from 10:00 UTC to 23:59 UTC (4:00 AM – 6:00 PM MDT) on Fri, Sat, Sun, Mon
    - cron: '*/15 10-23 * * 5,6,0,1'
    # Off-hours every 2 hours
    - cron: '0 0-9 * * 5,6,0,1'
    # Mid-week every 6 hours
    - cron: '0 */6 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install certifi beautifulsoup4 requests

      - name: Fetch & Build Dashboard
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python3 fetch_serie_a.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4